<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Niyamak — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #121317;
      --surface: #1a1b21;
      --primary: #8b5cf6;
      --text: #f3f4f8;
      --muted: #9aa1b2;
      --border: #2d2e38;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6fa; --surface: #ffffff; --primary: #2563eb;
        --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
      }
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 3rem 2.5rem; text-align: center; max-width: 420px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .icon {
      width: 80px; height: 80px; margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, var(--primary), #6d28d9);
      border-radius: 22px; display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: .5rem; }
    p { color: var(--muted); font-size: .95rem; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--primary); color: #fff; border: none; border-radius: 10px;
      padding: .75rem 1.5rem; font-size: .9rem; font-weight: 700; cursor: pointer;
      text-decoration: none; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .status { margin-top: 1.5rem; font-size: .8rem; color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: .4rem; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Niyamak can't reach the network right now. Check your connection and try again — your cached data and app shell are available.</p>
    <button class="btn" onclick="window.location.reload()">
      ↻ Try Again
    </button>
    <p class="status"><span class="dot"></span>No internet connection detected</p>
  </div>
  <script>
    window.addEventListener('online', () => { window.location.reload(); });
  </script>
</body>
</html>
